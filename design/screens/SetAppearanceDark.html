<style>
body{margin:0}

<body>
<div style="width: 390px; min-height: 1330px; box-sizing: border-box; padding: 48px 24px 40px; display: flex; flex-direction: column; gap: 20px; background: #0E1512; color: #ECF1EC; font-family: 'Geist', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="SettingsDark.html" style="min-height: 44px; align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #8FD0B5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Settings</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 30px; line-height: 34px">Appearance</h1>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Look</h2>
<div style="background: #18221D; border: 1px solid #2C3933; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2C3933">
<span id="a-theme" style="font-size: 14px; font-weight: 500">Theme</span>
<div role="group" aria-labelledby="a-theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #243029">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #3A4A42; color: #ECF1EC; font: 600 14px 'Geist', system-ui, sans-serif">Light</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">Dark</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">Follow phone</button>
</div>
</div>
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2C3933">

<button aria-label="Forest green" aria-pressed="true" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #1F6B52; outline: 2px solid #ECF1EC"></button>
<button aria-label="Deep blue" aria-pressed="false" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #173A6B"></button>
<button aria-label="Plum" aria-pressed="false" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #4A2545"></button>
<button aria-label="Charcoal" aria-pressed="false" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #22282B"></button>
<button aria-label="Brown" aria-pressed="false" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #6B3A1E"></button>
<button aria-label="Wine red" aria-pressed="false" style="width: 44px; height: 44px; padding: 0; border: 3px solid #18221D; border-radius: 22px; background: #7A1F2B"></button>
</div>
</div>
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2C3933">

<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #3A4A42; color: #ECF1EC; font: 600 14px 'Geist', system-ui, sans-serif">Colourful</button>

</div>

</div>

<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 0; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">Square</button>
</div>
</div>
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px">
<span id="a-chart" style="font-size: 14px; font-weight: 500">Category chart</span>
<div role="group" aria-labelledby="a-chart" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #243029">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #3A4A42; color: #ECF1EC; font: 600 14px 'Geist', system-ui, sans-serif">Pie</button>

</div>
</div>

<div style="background: #18221D; border: 1px solid #2C3933; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">

</div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2C3933">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#8A9A92"><circle cx="9" cy="6" r="1.500"></circle><circle cx="15" cy="6" r="1.500"></circle><circle cx="9" cy="12" r="1.500"></circle><circle cx="15" cy="12" r="1.500"></circle><circle cx="9" cy="18" r="1.500"></circle><circle cx="15" cy="18" r="1.500"></circle></svg>

</div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2C3933">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#8A9A92"><circle cx="9" cy="6" r="1.500"></circle><circle cx="15" cy="6" r="1.500"></circle><circle cx="9" cy="12" r="1.500"></circle><circle cx="15" cy="12" r="1.500"></circle><circle cx="9" cy="18" r="1.500"></circle><circle cx="15" cy="18" r="1.500"></circle></svg>
<span style="flex: 1; font-size: 14px; font-weight: 500">Budgets at a glance</span>
<button role="switch" aria-checked="false" aria-label="Budgets at a glance" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #5F6E66; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button>

<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px">
<span id="a-open" style="font-size: 14px; font-weight: 500">The app opens on</span>
<div role="group" aria-labelledby="a-open" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #243029">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #3A4A42; color: #ECF1EC; font: 600 14px 'Geist', system-ui, sans-serif">Home</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">Add</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">Insights</button>
</div>
</div>
</div>
</section>
</div>
