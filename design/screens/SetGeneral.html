<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo settings, general and accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#C9CEC8}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; min-height: 1100px; box-sizing: border-box; padding: 48px 24px 40px; display: flex; flex-direction: column; gap: 20px; background: #F5F6F1; color: #14201B; font-family: 'Geist', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="Settings.html" style="min-height: 44px; align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #0F3D30">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Settings</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 30px; line-height: 34px">General</h1>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Money and dates</h2>
<div style="background: #FFFFFF; border: 1px solid #DDE2DA; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #DDE2DA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Currency</span><span style="font-weight: 400; color: #55635C">UGX, Ugandan shilling</span></button>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #DDE2DA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Language</span><span style="font-weight: 400; color: #55635C">English</span></button>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #DDE2DA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Month starts on</span><span style="font-weight: 400; color: #55635C">The 1st</span></button>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #DDE2DA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Week starts on</span><span style="font-weight: 400; color: #55635C">Sunday</span></button>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Date style</span><span style="font-weight: 400; color: #55635C">19 Nov 2026</span></button>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Numbers and entry</h2>
<div style="background: #FFFFFF; border: 1px solid #DDE2DA; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #DDE2DA">
<span id="g-amounts" style="font-size: 14px; font-weight: 500">How amounts are written</span>
<div role="group" aria-labelledby="g-amounts" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E7EBE3">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #14201B; font: 600 14px 'Geist', system-ui, sans-serif">1,284,000</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #55635C; font: 500 14px 'Geist', system-ui, sans-serif">1.28M</button>
</div>
</div>
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 8px">
<span id="g-start" style="font-size: 14px; font-weight: 500">A new entry starts as</span>
<div role="group" aria-labelledby="g-start" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E7EBE3">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #14201B; font: 600 14px 'Geist', system-ui, sans-serif">Money out</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #55635C; font: 500 14px 'Geist', system-ui, sans-serif">Money in</button>
</div>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Accounts you pay from</h2>
<div style="background: #FFFFFF; border: 1px solid #DDE2DA; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA"><span style="width: 14px; height: 14px; border-radius: 7px; background: #6F8A2A; flex-shrink: 0"></span><span style="flex: 1; font-size: 14px; font-weight: 500">Cash</span>
<button role="switch" aria-checked="true" aria-label="Cash" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #0F3D30; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA"><span style="width: 14px; height: 14px; border-radius: 7px; background: #F5C400; flex-shrink: 0"></span><span style="flex: 1; font-size: 14px; font-weight: 500">MTN MoMo</span>
<button role="switch" aria-checked="true" aria-label="MTN MoMo" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #0F3D30; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA"><span style="width: 14px; height: 14px; border-radius: 7px; background: #D9272E; flex-shrink: 0"></span><span style="flex: 1; font-size: 14px; font-weight: 500">Airtel Money</span>
<button role="switch" aria-checked="true" aria-label="Airtel Money" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #0F3D30; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA"><span style="width: 14px; height: 14px; border-radius: 7px; background: #2C6FBB; flex-shrink: 0"></span><span style="flex: 1; font-size: 14px; font-weight: 500">Bank</span>
<button role="switch" aria-checked="false" aria-label="Bank" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #7C8A82; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #DDE2DA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #14201B"><span style="flex: 1">Picked first when you add</span><span style="font-weight: 400; color: #55635C">MTN MoMo</span></button>
<a href="AccountAdd.html" style="min-height: 52px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #0F3D30">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
Add an account</a>
</div>
</section>
</div>
</body>
</html>
