<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo transaction filters</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#C9CEC8}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 20px; display: flex; flex-direction: column; gap: 14px; background: #F5F6F1; color: #14201B; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Transactions.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #0F3D30">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Transactions</a>
<button style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; font: 600 14px 'Geist', system-ui, sans-serif; color: #0F3D30">Clear all</button>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 30px; line-height: 34px">Filters</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="f-cat" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Categories</span>
<div role="group" aria-labelledby="f-cat" style="display: flex; flex-wrap: wrap; gap: 6px">
<button aria-pressed="true" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #0F3D30; background: #0F3D30; color: #FFFFFF; font: 600 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F7A5C; outline: 2px solid #FFFFFF"></span>Food and shopping</button>
<button aria-pressed="true" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #0F3D30; background: #0F3D30; color: #FFFFFF; font: 600 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #E0A030; outline: 2px solid #FFFFFF"></span>Transport</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2C6FBB"></span>School fees</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #7B4FA6"></span>Bills</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #C2457A"></span>Fees and tax</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5B6770"></span>Other</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="f-acc" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Paid from</span>
<div role="group" aria-labelledby="f-acc" style="display: flex; gap: 6px">
<button aria-pressed="false" style="min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif">Cash</button>
<button aria-pressed="true" style="min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #F5C400; background: #F5C400; color: #14201B; font: 600 13px 'Geist', system-ui, sans-serif">MTN MoMo</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #D9272E"></span>Airtel</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #A9B5AD; background: #FFFFFF; color: #14201B; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2C6FBB"></span>Bank</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-min" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">At least, UGX</label>
<input id="f-min" inputmode="numeric" value="10,000" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #A9B5AD; border-radius: 14px; background: #FFFFFF; color: #14201B; font: 500 15px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-max" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">At most, UGX</label>
<input id="f-max" inputmode="numeric" placeholder="Any" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #A9B5AD; border-radius: 14px; background: #FFFFFF; color: #14201B; font: 500 15px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE2DA; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<a href="DateRange.html" style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA; font-size: 14px; font-weight: 500"><span style="flex: 1">Dates</span><span style="font-weight: 400; color: #55635C; font-variant-numeric: tabular-nums">5 to 19 Nov 2026</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55635C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></a>
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2DA"><span style="flex: 1; font-size: 14px; font-weight: 500">Only ones with a fee</span>
<button role="switch" aria-checked="false" aria-label="Only ones with a fee" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #7C8A82; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px"><span style="flex: 1; font-size: 14px; font-weight: 500">Only ones marked unusual</span>
<button role="switch" aria-checked="false" aria-label="Only ones marked unusual" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #7C8A82; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="f-sort" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55635C">Order</span>
<div role="group" aria-labelledby="f-sort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E7EBE3">
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #14201B; font: 600 14px 'Geist', system-ui, sans-serif">Newest</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #55635C; font: 500 14px 'Geist', system-ui, sans-serif">Largest</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #55635C; font: 500 14px 'Geist', system-ui, sans-serif">Oldest</button>
</div>
</div>
<a href="Transactions.html" style="margin-top: auto; min-height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #0F3D30; color: #FFFFFF; font-weight: 600; font-size: 16px">Show 23 transactions</a>
</div>
</body>
</html>
