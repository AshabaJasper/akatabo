<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo add a transaction, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#000}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 20px; display: flex; flex-direction: column; gap: 12px; background: #0E1512; color: #ECF1EC; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px">
<a href="MainDark.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; border: 1px solid #4A5A52; color: #ECF1EC">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="group" aria-label="Money out or money in" style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #243029">
<button aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: #3A4A42; color: #FF9466; font: 600 14px 'Geist', system-ui, sans-serif">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
Money out</button>
<button aria-pressed="false" style="min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: transparent; color: #A3B2AA; font: 500 14px 'Geist', system-ui, sans-serif">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"></path><path d="M15 17H7V9"></path></svg>
Money in</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="amount" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Amount, UGX</label>
<input id="amount" inputmode="numeric" value="45,000" style="width: 100%; box-sizing: border-box; min-height: 56px; padding: 0; border: 0; border-bottom: 2px solid #3FB08A; background: transparent; color: #ECF1EC; font: 700 44px/52px 'Bricolage Grotesque', system-ui, sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="what" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">What was it for</label>
<input id="what" value="Groceries, Nakasero market" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #4A5A52; border-radius: 14px; background: #18221D; color: #ECF1EC; font: 500 15px 'Geist', system-ui, sans-serif">
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 id="pick-cat" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Category</h2>
<span style="min-height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 14px; background: #FFC078; font-size: 12px; font-weight: 600; color: #14201B">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"></rect><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"></path></svg>
Suggested: Food, 87% sure</span>
</div>
<div role="group" aria-labelledby="pick-cat" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button aria-pressed="true" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid #3fb08a; border-radius: 14px; background: #243029; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #1F7A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.500 10h-13L4 9z"></path><path d="M9 9l3-5 3 5"></path></svg></span>Food</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #E0A030; color: #14201B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="13" rx="3"></rect><path d="M5 11h14M8 17v3M16 17v3"></path></svg></span>Transport</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #7B4FA6; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"></path></svg></span>Bills</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #2C6FBB; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg></span>School</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #3F4AA0; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><path d="M16 5a3 3 0 0 1 0 6M17 14a6 6 0 0 1 4 6"></path></svg></span>Family</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #1C8C97; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5V4z"></path></svg></span>Health</button>
<button aria-pressed="false" style="min-height: 72px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid transparent; border-radius: 14px; background: transparent; color: #ECF1EC; font: 500 12px 'Geist', system-ui, sans-serif"><span style="width: 40px; height: 40px; border-radius: 10px; background: #5B6770; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="18" cy="12" r="1"></circle></svg></span>Other</button>
<a href="CategoryEditDark.html" style="min-height: 72px; box-sizing: border-box; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px dashed #4A5A52; border-radius: 14px; font-size: 12px; font-weight: 500; color: #ECF1EC"><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #8FD0B5"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></span>New</a>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="paid-from" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Paid from</span>
<div role="group" aria-labelledby="paid-from" style="display: flex; gap: 6px">
<button aria-pressed="false" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #4A5A52; background: #18221D; color: #ECF1EC; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6F8A2A"></span>Cash</button>
<button aria-pressed="true" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #F5C400; background: #F5C400; color: #14201B; font: 600 13px 'Geist', system-ui, sans-serif">MTN MoMo</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #4A5A52; background: #18221D; color: #ECF1EC; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #D9272E"></span>Airtel</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #4A5A52; background: #18221D; color: #ECF1EC; font: 500 13px 'Geist', system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2C6FBB"></span>Bank</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fee" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Fee, if any</label>
<input id="fee" inputmode="numeric" value="1,000" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #4A5A52; border-radius: 14px; background: #18221D; color: #ECF1EC; font: 500 15px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="when" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">When</label>
<input id="when" value="Today, 09:14" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #4A5A52; border-radius: 14px; background: #18221D; color: #ECF1EC; font: 500 15px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">
</div>
</div>
<a href="MainDark.html" style="margin-top: auto; min-height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1F6B52; color: #FFFFFF; font-weight: 600; font-size: 16px">Save transaction</a>
</div>
</body>
</html>
