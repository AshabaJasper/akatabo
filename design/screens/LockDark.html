<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo PIN entry, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#000}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 36px 36px; display: flex; flex-direction: column; align-items: center; gap: 28px; background: #0C1A15; color: #FFFFFF; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1">Akatabo</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 22px; line-height: 26px">Enter your PIN</h1>
<div role="img" aria-label="2 of 4 digits entered" style="display: flex; gap: 16px">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid #B7CFC4; background: #FFC078"></span>
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid #B7CFC4; background: #FFC078"></span>
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid #B7CFC4; background: transparent"></span>
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid #B7CFC4; background: transparent"></span>
</div>
<span style="font-size: 13px; color: #B7CFC4">Your money details stay hidden until you unlock.</span>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 28px; justify-content: center">

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">1</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">2</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">3</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">4</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">5</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">6</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">7</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">8</button>

<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">9</button>

<a href="MainDark.html" aria-label="Unlock with fingerprint" style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; border-radius: 38px; color: #FFC078">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.750" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0v3"></path><path d="M9 10a3 3 0 0 1 6 0v4c0 2-.500 4-1.500 6"></path><path d="M12 10v4c0 2-.500 4-1.500 5.500"></path><path d="M6 13c0 2-.300 3.500-1 5"></path><path d="M18 16c0 1-.200 2-.500 3"></path></svg></a>
<button style="width: 76px; height: 76px; padding: 0; border: 1px solid #5E8777; border-radius: 38px; background: #1E3D31; color: #FFFFFF; font: 600 28px 'Bricolage Grotesque', system-ui, sans-serif">0</button>
<button aria-label="Delete the last digit" style="width: 76px; height: 76px; padding: 0; border: 0; border-radius: 38px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7 6-7z"></path><path d="M12 9.500l5 5M17 9.500l-5 5"></path></svg></button>
</div>
<button style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; font: 500 14px 'Geist', system-ui, sans-serif; color: #B7CFC4; text-decoration: underline">Forgot your PIN?</button>
</div>
</body>
</html>
