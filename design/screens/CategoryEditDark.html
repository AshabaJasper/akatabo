<!doctype html>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 20px; display: flex; flex-direction: column; gap: 14px; background: #0E1512; color: #ECF1EC; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

<a href="SetCategoriesDark.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #8FD0B5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Categories</a>
<button style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; font: 500 14px 'Geist', system-ui, sans-serif; color: #FF9466">Delete</button>
</div>
<div style="display: flex; align-items: center; gap: 14px">

</div>
