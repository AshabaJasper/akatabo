<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo set a budget, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#000}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 20px; display: flex; flex-direction: column; gap: 12px; background: #0E1512; color: #ECF1EC; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="BudgetsDark.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #8FD0B5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Budgets</a>
<button style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; font: 500 14px 'Geist', system-ui, sans-serif; color: #FF9466">Remove budget</button>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #E0A030; color: #14201B; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="13" rx="3"></rect><path d="M5 11h14M8 17v3M16 17v3"></path></svg></span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">Transport budget</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="b-amount" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A3B2AA">Each month, UGX</label>
<input id="b-amount" inputmode="numeric" value="200,000" style="width: 100%; box-sizing: border-box; min-height: 56px; padding: 0; border: 0; border-bottom: 2px solid #3FB08A; background: transparent; color: #ECF1EC; font: 700 44px/52px 'Bricolage Grotesque', system-ui, sans-serif">
</div>
<div role="group" aria-label="Quick amounts" style="display: flex; gap: 6px">
<button aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3FB08A; background: #1F6B52; color: #FFFFFF; font: 600 13px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">200,000</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #4A5A52; background: #18221D; color: #ECF1EC; font: 500 13px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">220,000</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 22px; border: 1px solid #4A5A52; background: #18221D; color: #ECF1EC; font: 500 13px 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums">240,000 <span style="padding: 2px 8px; border-radius: 14px; background: #FFC078; font-size: 12px; font-weight: 600; color: #14201B">suggested</span></button>
</div>
<section style="background: #18221D; border: 1px solid #2C3933; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 18px; line-height: 22px">Your last 6 months</h2>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3B2AA"><span style="width: 16px; height: 0; border-top: 2px dashed #ECF1EC"></span>this budget</span>
</div>
<div role="img" aria-label="Bar chart of transport spending for six months against a budget of 200 thousand. June 182, July 205, August 196, September 228, October 244, November 236 so far. Four of the six months are over the budget line." style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; height: 108px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; color: #A3B2AA; font-variant-numeric: tabular-nums">182</span><div style="width: 100%; height: 67px; border-radius: 5px 5px 0 0; background: #E0A030; color: #14201B"></div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #FF9466">205</span><div style="width: 100%; height: 76px; border-radius: 5px 5px 0 0; background: #B93A0A"></div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; color: #A3B2AA; font-variant-numeric: tabular-nums">196</span><div style="width: 100%; height: 72px; border-radius: 5px 5px 0 0; background: #E0A030; color: #14201B"></div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #FF9466">228</span><div style="width: 100%; height: 84px; border-radius: 5px 5px 0 0; background: #B93A0A"></div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #FF9466">244</span><div style="width: 100%; height: 90px; border-radius: 5px 5px 0 0; background: #B93A0A"></div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #FF9466">236</span><div style="width: 100%; height: 87px; border-radius: 5px 5px 0 0; background: #B93A0A"></div></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 74px; height: 0; border-top: 2px dashed #ECF1EC"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; font-size: 12px; color: #A3B2AA; text-align: center; border-top: 1px solid #4A5A52; padding-top: 4px"><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span style="font-weight: 600; color: #ECF1EC">Nov</span></div>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 1.4">You went over 200,000 in 4 of the last 6 months. A budget of 240,000 would have covered 5 of them.</p>
</section>
<div style="background: #18221D; border: 1px solid #2C3933; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column">
<div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2C3933"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">Carry over what is left</span><span style="font-size: 12px; color: #A3B2AA">Unspent money adds to next month</span></span>
<button role="switch" aria-checked="false" aria-label="Carry over what is left" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; box-sizing: border-box; padding: 2px; border-radius: 14px; background: #5F6E66; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></button></div>
<button style="width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; font: 500 14px 'Geist', system-ui, sans-serif; color: #ECF1EC"><span style="flex: 1">Warn me at</span><span style="font-weight: 400; color: #A3B2AA; font-variant-numeric: tabular-nums">80% used</span></button>
</div>
<a href="BudgetsDark.html" style="margin-top: auto; min-height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1F6B52; color: #FFFFFF; font-weight: 600; font-size: 16px">Save budget</a>
</div>
</body>
</html>
