<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akatabo edit savings goal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#C9CEC8}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F6F1; color: #14201B; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">
<div style="flex:1;min-height:0;overflow-y:auto;padding:48px 24px 24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a href="GoalDetail.html" style="min-height:44px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#0F3D30"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>School fees</a>
</div>
<div style="display:flex;align-items:center;gap:12px">
<span style="width:48px;height:48px;border-radius:14px;background:#1C8C97;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span>
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:26px;line-height:30px">Edit goal</h1>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="g-name" style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#55635C">Name</label>
<input id="g-name" value="School fees" style="width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border:1px solid #A9B5AD;border-radius:14px;background:#FFFFFF;color:#14201B;font:500 16px Geist, system-ui, sans-serif">
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<label for="g-target" style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#55635C">Target, UGX</label>
<input id="g-target" inputmode="numeric" value="1,000,000" style="width:100%;box-sizing:border-box;min-height:56px;padding:0;border:0;border-bottom:2px solid #0F3D30;background:transparent;color:#14201B;font:700 40px/48px 'Bricolage Grotesque', system-ui, sans-serif;font-variant-numeric:tabular-nums">
<p style="margin:4px 0 0;font-size:13px;line-height:18px;color:#55635C">UGX 39,700 a week to make it by 1 March 2027.</p>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#55635C">Target date, optional</span>
<div style="display:flex;gap:8px;align-items:center">
<button style="flex:1;min-height:48px;padding:0 14px;display:flex;align-items:center;gap:10px;border:1px solid #A9B5AD;border-radius:14px;background:#FFFFFF;color:#14201B;font:500 16px Geist, system-ui, sans-serif"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>1 March 2027</button>
<button style="min-height:48px;padding:0 12px;border:0;background:transparent;font:500 14px Geist, system-ui, sans-serif;color:#0F3D30">Clear</button>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#55635C">Colour</span>
<div style="display:flex;gap:10px;flex-wrap:nowrap"><button aria-label="Teal" aria-pressed="true" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#1C8C97;outline:2px solid #14201B;outline-offset:2px;"></button><button aria-label="Amber" aria-pressed="false" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#E0A030;"></button><button aria-label="Indigo" aria-pressed="false" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#3F4AA0;"></button><button aria-label="Purple" aria-pressed="false" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#7B4FA6;"></button><button aria-label="Pink" aria-pressed="false" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#C2457A;"></button><button aria-label="Green" aria-pressed="false" style="width:44px;height:44px;border-radius:22px;border:0;padding:0;background:#1F7A5C;"></button></div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#55635C">Remind me</span>
<div role="group" aria-label="Reminder" style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#E7EBE3"><button aria-pressed="false" style="flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:#55635C;font:500 14px Geist, system-ui, sans-serif">Off</button><button aria-pressed="true" style="flex:1;min-height:44px;border:0;border-radius:10px;background:#FFFFFF;color:#14201B;font:600 14px Geist, system-ui, sans-serif">Weekly</button><button aria-pressed="false" style="flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:#55635C;font:500 14px Geist, system-ui, sans-serif">Monthly</button></div>
<p style="margin:0;font-size:12px;line-height:18px;color:#55635C">A reminder each week to add to this goal.</p>
</div>
<section style="background:#FFFFFF;border:1px solid #DDE2DA;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px"><button style="width:100%;padding:0;border:0;background:transparent;text-align:left;font:600 15px Geist, system-ui, sans-serif;color:#14201B">Archive goal</button><p style="margin:0;font-size:12px;line-height:18px;color:#55635C">Its money stays set aside. A goal with moves cannot be deleted.</p></section>
<a href="GoalDetail.html" style="min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#0F3D30;color:#FFFFFF;font-weight:600;font-size:16px">Save goal</a>
</div>
</div>
</body>
</html>
