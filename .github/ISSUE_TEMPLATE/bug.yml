name: Bug report
description: Something in Akatabo does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include real financial records: use sample entries.
        For a security problem, use Security > Report a vulnerability instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Add
        2. Type 5,000 and choose Transport
        3. Tap Save
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under Settings > About.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where you installed it
      options:
        - F-Droid
        - IzzyOnDroid
        - Google Play
        - GitHub release APK
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Tecno Spark 20, Android 13"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not sure
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Hide or blur any real amounts or names before you attach them.
