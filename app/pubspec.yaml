name: akatabo
description: "Akatabo, a free money tracker for Uganda. Everything stays on the phone."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # State and data
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  collection: ^1.19.1
  uuid: ^4.6.0
  clock: ^1.1.3
  intl: ^0.20.3

  # Navigation, drawing
  go_router: ^18.1.4
  fl_chart: ^1.3.1
  path_parsing: ^1.1.0

  # Privacy, reminders, files
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_file_dialog: ^3.3.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  archive: ^4.7.1
  cryptography: ^2.9.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.2.0
  mocktail: ^1.0.5
  image: ^4.13.1
  fake_async: 1.3.3
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: false

  assets:
    - assets/smart/
    # Static Geist for the PDF report (the pdf package reads static fonts only), cut from
    # Geist-Variable.ttf with fonttools 4.68.0; covered by OFL-Geist.txt.
    - assets/fonts/Geist-Regular.ttf
    - assets/fonts/Geist-SemiBold.ttf
    # The logo in the PDF report header, drawn by tool/render_brand_test.dart.
    - assets/brand/pdf-logo.png
    # Shown on About > Open-source licences.
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Geist.txt

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf

# App icon: the Akatabo notebook mark (design/brand/README.md) on paper. The PNGs in
# assets/icon/ are drawn by tool/render_brand_test.dart from lib/core/brand/akatabo_mark.dart;
# after changing the mark run `flutter test tool/render_brand_test.dart`, then
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#F5F6F1"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
